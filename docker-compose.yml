services:
  db:
    image: postgres:16-alpine
    container_name: kintsu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kintsu
      POSTGRES_PASSWORD: kintsu_dev_password
      POSTGRES_DB: kintsu_os
    ports:
      - "5432:5432"
    volumes:
      - kintsu_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsu -d kintsu_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kintsu-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kintsu:kintsu_dev_password@db:5432/kintsu_os
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production}
      NODE_ENV: production
    ports:
      - "3000:3000"
    profiles:
      - full

volumes:
  kintsu_db_data:
